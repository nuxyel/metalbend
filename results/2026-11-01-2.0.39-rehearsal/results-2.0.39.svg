<text x="24.0" y="698.0" class="title" text-anchor="start">What 16 threads buy over one</text>
<text x="24.0" y="720.0" class="sub" text-anchor="start">Wall-time speedup of the same program on 16 threads; the output is the same at both. Higher is better.</text>
