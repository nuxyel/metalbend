name: CI

# Bits only: GitHub's runners cannot count instructions with perf, so CI checks that every workload and C target
# prints its oracle (oracles.tsv), runs the tools' unit tests, and runs the mutation run. Timings come from run.sh and
# release.sh on an idle machine.
on:
  push:
    branches: [main, devel, "v1/**"]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"   # weekly, on devel: the runner's image (clang, glibc) changes under a pinned Bend

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: bits, tests, mutants
    runs-on: ubuntu-24.04      # pinned; 4 vCPU, 16 GB RAM
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'devel' || '' }}

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.14"

      # Bend and the BendHub packages the workloads import (under ~/.bend/lib), keyed by the pins: setup.sh has
      # Bend's, the import lines the packages'. The key also carries the exact Python (3.14.9, not 3.14): a cache
      # made under one interpreter is never reused under another
      - name: Cache Bend, Lean and the BendHub packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.bend
            ~/.elan
          key: bend-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('scripts/setup.sh', 'workloads/*/main.bend', 'lib/*.bend') }}

      - name: clang
        run: |
          command -v clang || { sudo apt-get update -q && sudo apt-get install -y -q clang; }
          clang --version | head -1

      - name: Set up (Bend 2.0.39, Lean 4.34.0)
        run: make setup

      # written on every run, never cached: the generator is part of what is checked
      - name: Data
        run: make data

      - name: Check (every workload on 1 and 16 threads and every C target against oracles.tsv)
        shell: bash
        run: |
          set -o pipefail
          make check 2>&1 | tee check.log

      - name: Test (analyze.py, scripts/chart.py, run.sh's guard)
        shell: bash
        run: |
          set -o pipefail
          make test 2>&1 | tee -a check.log

      - name: Laws (the proofs, and every mutant refused)
        shell: bash
        run: |
          set -o pipefail
          make laws 2>&1 | tee -a check.log

      - name: Mutation run
        shell: bash
        run: |
          set -o pipefail
          make mutate 2>&1 | tee -a check.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: check-log
          path: check.log
