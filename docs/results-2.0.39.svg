<svg xmlns="http://www.w3.org/2000/svg" width="820" height="894" viewBox="0 0 820 894" role="img" aria-labelledby="t">
<title id="t">Bend 2.0.39 against handwritten C, and its speedups on 16 threads</title>
<style>
  svg { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .bg { fill: #fcfcfb; }
  .title { font-size: 19px; font-weight: 600; fill: #0b0b0b; }
  .sub { font-size: 13px; fill: #52514e; }
  .label { font-size: 13.5px; fill: #0b0b0b; }
  .name { font-size: 11px; fill: #6f6e69; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; }
  .value { font-size: 13px; font-weight: 600; fill: #0b0b0b; paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; }
  .note { font-size: 12px; fill: #6f6e69; paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; }
  .tick { font-size: 11px; fill: #6f6e69; }
  .reflabel { font-size: 11.5px; fill: #52514e; }
  .foot { font-size: 11px; fill: #6f6e69; }
  .grid { stroke: #e6e5e0; stroke-width: 1; }
  .ref { stroke: #52514e; stroke-width: 1.5; stroke-dasharray: 4 3; }
  .bar { fill: #2a78d6; }
  .flat { fill: #b4b2a9; }
  .cut { stroke: #fcfcfb; stroke-width: 3; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .title, .label, .value { fill: #f0efec; }
    .sub, .reflabel { fill: #c3c2b7; }
    .name, .note, .tick, .foot { fill: #9d9c94; }
    .grid { stroke: #33332f; }
    .ref { stroke: #c3c2b7; }
    .bar { fill: #3987e5; }
    .flat { fill: #6f6e69; }
    .cut, .value, .note { stroke: #1a1a19; }
  }
</style>
<rect class="bg" width="820" height="894"/>
<text x="24.0" y="38.0" class="title" text-anchor="start">How far Bend 2.0.39 is from handwritten C</text>
<text x="24.0" y="60.0" class="sub" text-anchor="start">CPU cycles of Bend's program per cycle of a C version that prints the same bits; one thread. Lower is better.</text>
<line x1="290.0" y1="82" x2="290.0" y2="302" class="grid"/>
<text x="290.0" y="318.0" class="tick" text-anchor="middle">0x</text>
<line x1="354.3" y1="82" x2="354.3" y2="302" class="grid"/>
<text x="354.3" y="318.0" class="tick" text-anchor="middle">1x</text>
<line x1="418.7" y1="82" x2="418.7" y2="302" class="grid"/>
<text x="418.7" y="318.0" class="tick" text-anchor="middle">2x</text>
<line x1="483.0" y1="82" x2="483.0" y2="302" class="grid"/>
<text x="483.0" y="318.0" class="tick" text-anchor="middle">3x</text>
<line x1="547.3" y1="82" x2="547.3" y2="302" class="grid"/>
<text x="547.3" y="318.0" class="tick" text-anchor="middle">4x</text>
<line x1="611.7" y1="82" x2="611.7" y2="302" class="grid"/>
<text x="611.7" y="318.0" class="tick" text-anchor="middle">5x</text>
<line x1="676.0" y1="82" x2="676.0" y2="302" class="grid"/>
<text x="676.0" y="318.0" class="tick" text-anchor="middle">6x</text>
<line x1="354.3" y1="76" x2="354.3" y2="302" class="ref"/>
<text x="358.3" y="74.0" class="reflabel" text-anchor="start">1x = as fast as C</text>
<text x="278.0" y="102.0" class="label" text-anchor="end">AdamW optimizer step</text>
<text x="278.0" y="116.0" class="name" text-anchor="end">adamw</text>
<rect x="290" y="95.0" width="76.9" height="18" rx="3" class="bar"/>
<text x="372.9" y="108.0" class="value" text-anchor="start">1.20x</text>
<text x="278.0" y="138.0" class="label" text-anchor="end">matrix product</text>
<text x="278.0" y="152.0" class="name" text-anchor="end">gemm-tile8</text>
<rect x="290" y="131.0" width="85.6" height="18" rx="3" class="bar"/>
<text x="381.6" y="144.0" class="value" text-anchor="start">1.33x</text>
<text x="278.0" y="174.0" class="label" text-anchor="end">MNIST training step</text>
<text x="278.0" y="188.0" class="name" text-anchor="end">mnist-step</text>
<rect x="290" y="167.0" width="125.9" height="18" rx="3" class="bar"/>
<text x="421.9" y="180.0" class="value" text-anchor="start">1.96x</text>
<text x="278.0" y="210.0" class="label" text-anchor="end">matrix-vector product</text>
<text x="278.0" y="224.0" class="name" text-anchor="end">matvec-bands</text>
<rect x="290" y="203.0" width="149.1" height="18" rx="3" class="bar"/>
<text x="445.1" y="216.0" class="value" text-anchor="start">2.32x</text>
<text x="278.0" y="246.0" class="label" text-anchor="end">softmax and cross-entropy</text>
<text x="278.0" y="260.0" class="name" text-anchor="end">softmax-ce</text>
<rect x="290" y="239.0" width="305.5" height="18" rx="3" class="bar"/>
<text x="601.5" y="252.0" class="value" text-anchor="start">4.75x</text>
<text x="278.0" y="282.0" class="label" text-anchor="end">16 MB file read, built-in</text>
<text x="278.0" y="296.0" class="name" text-anchor="end">read-native</text>
<rect x="290" y="275.0" width="386.0" height="18" rx="3" class="bar"/>
<line x1="651.0" y1="295.0" x2="657.0" y2="273.0" class="cut"/>
<line x1="659.0" y1="295.0" x2="665.0" y2="273.0" class="cut"/>
<text x="682.0" y="288.0" class="value" text-anchor="start">21x, bar cut to fit</text>
<text x="24.0" y="374.0" class="title" text-anchor="start">What 16 threads buy over one</text>
<text x="24.0" y="396.0" class="sub" text-anchor="start">Wall-time speedup of the same program on 16 threads; the output is the same at both. Higher is better.</text>
<line x1="290.0" y1="418" x2="290.0" y2="818" class="grid"/>
<text x="290.0" y="834.0" class="tick" text-anchor="middle">0x</text>
<line x1="367.2" y1="418" x2="367.2" y2="818" class="grid"/>
<text x="367.2" y="834.0" class="tick" text-anchor="middle">1x</text>
<line x1="444.4" y1="418" x2="444.4" y2="818" class="grid"/>
<text x="444.4" y="834.0" class="tick" text-anchor="middle">2x</text>
<line x1="521.6" y1="418" x2="521.6" y2="818" class="grid"/>
<text x="521.6" y="834.0" class="tick" text-anchor="middle">3x</text>
<line x1="598.8" y1="418" x2="598.8" y2="818" class="grid"/>
<text x="598.8" y="834.0" class="tick" text-anchor="middle">4x</text>
<line x1="676.0" y1="418" x2="676.0" y2="818" class="grid"/>
<text x="676.0" y="834.0" class="tick" text-anchor="middle">5x</text>
<line x1="367.2" y1="412" x2="367.2" y2="818" class="ref"/>
<text x="371.2" y="410.0" class="reflabel" text-anchor="start">1x = no gain</text>
<text x="278.0" y="438.0" class="label" text-anchor="end">transformer block, forward + backward</text>
<text x="278.0" y="452.0" class="name" text-anchor="end">block-step</text>
<rect x="290" y="431.0" width="346.7" height="18" rx="3" class="bar"/>
<text x="642.7" y="444.0" class="value" text-anchor="start">4.49x</text>
<text x="278.0" y="474.0" class="label" text-anchor="end">matrix-vector product</text>
<text x="278.0" y="488.0" class="name" text-anchor="end">matvec-bands</text>
<rect x="290" y="467.0" width="324.9" height="18" rx="3" class="bar"/>
<text x="620.9" y="480.0" class="value" text-anchor="start">4.21x</text>
<text x="278.0" y="510.0" class="label" text-anchor="end">attention, forward + backward</text>
<text x="278.0" y="524.0" class="name" text-anchor="end">attention-step</text>
<rect x="290" y="503.0" width="283.3" height="18" rx="3" class="bar"/>
<text x="579.3" y="516.0" class="value" text-anchor="start">3.67x</text>
<text x="278.0" y="546.0" class="label" text-anchor="end">matrix product, parallel blocks</text>
<text x="278.0" y="560.0" class="name" text-anchor="end">gemm-fork</text>
<rect x="290" y="539.0" width="167.8" height="18" rx="3" class="bar"/>
<text x="463.8" y="552.0" class="value" text-anchor="start">2.17x</text>
<text x="278.0" y="582.0" class="label" text-anchor="end">MNIST training step</text>
<text x="278.0" y="596.0" class="name" text-anchor="end">mnist-step</text>
<rect x="290" y="575.0" width="80.1" height="18" rx="3" class="flat"/>
<text x="376.1" y="588.0" class="value" text-anchor="start">1.04x</text>
<text x="421.6" y="588.0" class="note" text-anchor="start">its loops run one after another</text>
<text x="278.0" y="618.0" class="label" text-anchor="end">AdamW optimizer step</text>
<text x="278.0" y="632.0" class="name" text-anchor="end">adamw</text>
<rect x="290" y="611.0" width="77.5" height="18" rx="3" class="flat"/>
<text x="373.5" y="624.0" class="value" text-anchor="start">1.00x</text>
<text x="419.0" y="624.0" class="note" text-anchor="start">its loops run one after another</text>
<text x="278.0" y="654.0" class="label" text-anchor="end">softmax and cross-entropy</text>
<text x="278.0" y="668.0" class="name" text-anchor="end">softmax-ce</text>
<rect x="290" y="647.0" width="77.4" height="18" rx="3" class="flat"/>
<text x="373.4" y="660.0" class="value" text-anchor="start">1.00x</text>
<text x="418.9" y="660.0" class="note" text-anchor="start">its loops run one after another</text>
<text x="278.0" y="690.0" class="label" text-anchor="end">RMSNorm</text>
<text x="278.0" y="704.0" class="name" text-anchor="end">rmsnorm-step</text>
<rect x="290" y="683.0" width="77.1" height="18" rx="3" class="flat"/>
<text x="373.1" y="696.0" class="value" text-anchor="start">1.00x</text>
<text x="418.6" y="696.0" class="note" text-anchor="start">its loops run one after another</text>
<text x="278.0" y="726.0" class="label" text-anchor="end">matrix product</text>
<text x="278.0" y="740.0" class="name" text-anchor="end">gemm-tile8</text>
<rect x="290" y="719.0" width="76.8" height="18" rx="3" class="flat"/>
<text x="372.8" y="732.0" class="value" text-anchor="start">1.00x</text>
<text x="418.3" y="732.0" class="note" text-anchor="start">a sequential loop by design</text>
<text x="278.0" y="762.0" class="label" text-anchor="end">16 MB file read, bend-ml-binary-read</text>
<text x="278.0" y="776.0" class="name" text-anchor="end">read-binary</text>
<rect x="290" y="755.0" width="69.8" height="18" rx="3" class="flat"/>
<text x="365.8" y="768.0" class="value" text-anchor="start">0.90x</text>
<text x="411.3" y="768.0" class="note" text-anchor="start">slower: starting the workers costs more</text>
<text x="278.0" y="798.0" class="label" text-anchor="end">16 MB file read, built-in</text>
<text x="278.0" y="812.0" class="name" text-anchor="end">read-native</text>
<rect x="290" y="791.0" width="64.2" height="18" rx="3" class="flat"/>
<text x="360.2" y="804.0" class="value" text-anchor="start">0.83x</text>
<text x="405.7" y="804.0" class="note" text-anchor="start">slower: starting the workers costs more</text>
<text x="24.0" y="862.0" class="foot" text-anchor="start">Core Ultra 7 155H. One thread: pinned to a P-core, user-mode cycles from perf stat. Medians over 5-7 rounds.</text>
<text x="24.0" y="878.0" class="foot" text-anchor="start">Source: runs.tsv in results/2026-10-25-d and results/2026-10-25-f.</text>
</svg>
